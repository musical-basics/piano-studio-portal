name: Trigger Reminders
on:
  schedule:
    # GitHub treats scheduled workflows as best-effort and drops high-frequency
    # ones under runner load: this ran ~6 times/day instead of 144 through
    # Aug 2026. Vercel Cron (vercel.json) is the primary trigger; this is the
    # backup, so keep it but do not rely on it alone.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Enable manual trigger
jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call API Route
        run: |
          # --fail-with-body so an auth or server error fails the job (and mails
          # the repo owner) instead of exiting 0 on a 401 body.
          curl --fail-with-body --silent --show-error --max-time 300 \
            "https://lessons.musicalbasics.com/api/cron/reminders?key=${{ secrets.CRON_SECRET }}"
